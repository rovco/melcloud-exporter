---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: melcloud-exporter-buildkit-client
spec:
  secretName: melcloud-exporter-buildkit-client-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - client auth
  commonName: melcloud-exporter-builder
  issuerRef:
    name: beam-intermediate-ca
    kind: ClusterIssuer
