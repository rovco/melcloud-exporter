---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: melcloud-exporter-github-app-key
  namespace: melcloud-exporter-ci
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: k8s-on-prem/argo-github-app-secret
        metadataPolicy: None
        property: githubAppPrivateKey
      secretKey: githubAppPrivateKey
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: secretstore-aws-production
  target:
    creationPolicy: Owner
    name: melcloud-exporter-github-app-key
    template:
      data:
        githubAppPrivateKey: '{{ .githubAppPrivateKey | replace "\\n" "\n" }}'
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: melcloud-exporter-github-token
  namespace: melcloud-exporter-ci
spec:
  appID: "1901485"
  auth:
    privateKey:
      secretRef:
        key: githubAppPrivateKey
        name: melcloud-exporter-github-app-key
  installID: "84462879"
  permissions:
    contents: read
  repositories:
    - melcloud-exporter
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: melcloud-exporter-git
  namespace: melcloud-exporter-ci
spec:
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: melcloud-exporter-github-token
  refreshInterval: 30m
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: melcloud-exporter-git
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: melcloud-exporter-registry
  namespace: melcloud-exporter-ci
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: k8s-on-prem/harbor-onprem-access-token
        metadataPolicy: None
      secretKey: .dockerconfigjson
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: secretstore-aws-production
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: melcloud-exporter-registry
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
