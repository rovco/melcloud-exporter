---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: melcloud-exporter-ci
  namespace: melcloud-exporter-ci
imagePullSecrets:
  - name: onpremregcred
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: melcloud-exporter-ci
  namespace: melcloud-exporter-ci
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: melcloud-exporter-ci
  namespace: melcloud-exporter-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: melcloud-exporter-ci
subjects:
  - kind: ServiceAccount
    name: melcloud-exporter-ci
    namespace: melcloud-exporter-ci
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: melcloud-exporter-ci-events
  namespace: argo-events
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: melcloud-exporter-ci-events
  namespace: melcloud-exporter-ci
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtemplates
    verbs:
      - get
      - list
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: melcloud-exporter-ci-events
  namespace: melcloud-exporter-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: melcloud-exporter-ci-events
subjects:
  - kind: ServiceAccount
    name: melcloud-exporter-ci-events
    namespace: argo-events
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argowf-admin-pods-melcloud-exporter-ci
  namespace: melcloud-exporter-ci
subjects:
  - kind: ServiceAccount
    name: argowf-admin
    namespace: argo-workflows
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argowf-admin-pods
