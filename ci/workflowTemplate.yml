---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/argoproj.io/workflowtemplate_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: melcloud-exporter-build
  namespace: melcloud-exporter-ci
spec:
  entrypoint: build
  serviceAccountName: melcloud-exporter-builder
  arguments:
    parameters:
      - name: tag
      - name: revision
  templates:
    - name: build
      inputs:
        parameters:
          - name: tag
          - name: revision
      activeDeadlineSeconds: 1800
      retryStrategy:
        limit: 2
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      outputs:
        parameters:
          - name: tag-object
            valueFrom:
              path: /workspace/outputs/tag-object.txt
          - name: peeled-commit
            valueFrom:
              path: /workspace/outputs/peeled-commit.txt
          - name: image-reference
            valueFrom:
              path: /workspace/outputs/image-reference.txt
          - name: manifest-digest
            valueFrom:
              path: /workspace/outputs/manifest-digest.txt
          - name: platform
            valueFrom:
              path: /workspace/outputs/platform.txt
      volumes:
        - name: workspace
          emptyDir: {}
        - name: client-cert
          secret:
            secretName: melcloud-exporter-buildkit-client-tls
        - name: registry-config
          secret:
            secretName: melcloud-exporter-registry
            items:
              - key: .dockerconfigjson
                path: config.json
      containerSet:
        containers:
          - name: clone
            image: "docker.op.vaarst.io/docker_proxy/alpine/git@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25"
            imagePullPolicy: IfNotPresent
            env:
              - name: TAG
                value: "{{inputs.parameters.tag}}"
              - name: REVISION
                value: "{{inputs.parameters.revision}}"
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: melcloud-exporter-git
                    key: token
            command:
              - sh
              - -c
              - |
                set -euo pipefail

                : "${TAG:?}"
                : "${REVISION:?}"

                # Defensive validation before either value reaches a git/shell
                # command. The repository is fixed (no caller-controlled repo
                # parameter exists in this WorkflowTemplate); tag/revision
                # still originate from Sensor-mapped webhook data once Phase 4
                # wires the trigger, so they are validated here even though
                # this phase only exercises manual, trusted `argo submit`.
                printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
                  || { echo "refusing unsafe tag '$TAG': expected exactly X.Y.Z" >&2; exit 1; }
                printf '%s' "$REVISION" | grep -Eq '^[0-9a-f]{40}$' \
                  || { echo "refusing unsafe revision '$REVISION': expected a 40-hex git object id" >&2; exit 1; }

                mkdir -p /workspace/src /workspace/outputs
                cd /workspace/src
                git init --quiet .
                git remote add origin "https://github.com/rovco/melcloud-exporter.git"
                # Keeps the token out of argv/`git remote -v`/process listing -
                # it is only ever read from $GITHUB_TOKEN inside this shell
                # function at credential-negotiation time.
                git config --local credential.helper \
                  '!f() { echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; }; f'

                # Fails with an explicit, specific message instead of letting
                # a nonexistent tag surface as git fetch's generic "couldn't
                # find remote ref" - which itself only showed up buried in
                # this container's own log, behind a confusing top-level
                # "no such file or directory" error from output-parameter
                # collection once `main` never ran.
                if ! git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null; then
                  echo "tag '$TAG' does not exist on $(git remote get-url origin)" >&2
                  exit 1
                fi

                git fetch --quiet --depth 1 origin "refs/tags/${TAG}:refs/tags/${TAG}"

                TAG_OBJECT=$(git rev-parse "refs/tags/${TAG}")
                TAG_TYPE=$(git cat-file -t "$TAG_OBJECT")
                PEELED_COMMIT=$(git rev-parse "refs/tags/${TAG}^{commit}")

                # `git cat-file -t` on the *supplied* revision - not FETCH_HEAD -
                # is what distinguishes a lightweight tag (revision IS a commit,
                # compared directly) from an annotated tag (revision is the tag
                # object's own SHA, peeled to its commit before comparison).
                if ! REVISION_TYPE=$(git cat-file -t "$REVISION" 2>/dev/null); then
                  echo "revision $REVISION is not an object reachable from fetched tag $TAG - rejecting" >&2
                  exit 1
                fi

                case "$REVISION_TYPE" in
                  tag)
                    REVISION_PEELED=$(git rev-parse "${REVISION}^{commit}")
                    ;;
                  commit)
                    REVISION_PEELED="$REVISION"
                    ;;
                  *)
                    echo "unexpected object type '$REVISION_TYPE' for revision $REVISION" >&2
                    exit 1
                    ;;
                esac

                if [ "$REVISION_PEELED" != "$PEELED_COMMIT" ]; then
                  echo "revision mismatch: supplied $REVISION ($REVISION_TYPE, peels to $REVISION_PEELED) does not match fetched tag $TAG (peels to $PEELED_COMMIT)" >&2
                  exit 1
                fi

                git checkout --quiet "$PEELED_COMMIT"

                printf '%s' "$TAG_OBJECT" > /workspace/outputs/tag-object.txt
                printf '%s' "$PEELED_COMMIT" > /workspace/outputs/peeled-commit.txt

                echo "verified tag=$TAG tag_object=$TAG_OBJECT ($TAG_TYPE) peeled_commit=$PEELED_COMMIT"
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: workspace
                mountPath: /workspace

          - name: main
            dependencies:
              - clone
            image: "docker.op.vaarst.io/docker_proxy/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea"
            imagePullPolicy: IfNotPresent
            env:
              - name: TAG
                value: "{{inputs.parameters.tag}}"
              - name: DOCKER_CONFIG
                value: /etc/buildkit-registry
            command:
              - sh
              - -c
              - |
                set -euo pipefail

                : "${TAG:?}"
                 IMAGE="docker.op.vaarst.io/devops/melcloud-exporter:${TAG}-argo"

                mkdir -p /workspace/outputs

                buildctl \
                  --addr "tcp://buildkitd.buildkit.svc:1234" \
                  --tlscacert /etc/buildkit-client/ca.crt \
                  --tlscert /etc/buildkit-client/tls.crt \
                  --tlskey /etc/buildkit-client/tls.key \
                  build \
                  --frontend dockerfile.v0 \
                  --local context=/workspace/src \
                  --local dockerfile=/workspace/src \
                  --opt platform=linux/amd64 \
                  --output "type=image,name=${IMAGE},push=true" \
                  --metadata-file /workspace/outputs/buildkit-metadata.json

                # Neither jq nor python3 is present in this (confirmed:
                # `docker run --entrypoint sh ... command -v jq python3`)
                # upstream moby/buildkit image, so extraction uses BusyBox
                # awk instead of a `grep -o | sed` pipeline: a pipeline's
                # final exit status is only the *last* command's (BusyBox sh
                # has no `pipefail`), so a `grep -o` that finds nothing would
                # still let a downstream `sed`/`head` exit 0 on empty input,
                # silently producing an empty $DIGEST instead of failing the
                # extraction step itself. A single `awk` program has no pipe
                # to bypass: it reads the file directly, and one `exit`
                # inside the matched pattern's action both stops at the
                # first match (no separate `head -n1`) and is the only exit
                # status the command substitution ever sees.
                #
                # `--metadata-file`'s `containerimage.digest` key is only
                # ever top-level JSON (not platform-suffixed - see
                # moby/buildkit exporter/containerimage/exptypes, suffixing
                # is reserved for containerimage.config/
                # containerimage.base.config on multi-platform builds, which
                # this single-`--opt platform` build never produces) with a
                # plain string value. Confirmed against a real
                # `buildctl --metadata-file` run (this task's own
                # verification, not merely reviewed by inspection) that the
                # exact key is `"containerimage.digest"` with a sibling
                # `"containerimage.config.digest"` key present in the same
                # file - the quoted, anchored pattern below matches only the
                # former, never the latter.
                #
                 # Treat parser misses/errors as an empty result so set -e
                 # cannot bypass the explicit, useful validation below.
                 DIGEST=$(awk -F'"' '/"containerimage\.digest"/ { print $4; exit }' \
                   /workspace/outputs/buildkit-metadata.json || true)

                if ! awk -v digest="$DIGEST" \
                  'BEGIN { exit !(length(digest) == 71 && digest ~ /^sha256:[0-9a-f]+$/) }'; then
                  echo "could not find a valid containerimage.digest (expected sha256:<64 hex chars>) in buildctl metadata file:" >&2
                  awk '{ print }' /workspace/outputs/buildkit-metadata.json >&2
                  exit 1
                fi

                printf '%s' "$DIGEST" > /workspace/outputs/manifest-digest.txt
                printf '%s' "$IMAGE" > /workspace/outputs/image-reference.txt
                printf '%s' "linux/amd64" > /workspace/outputs/platform.txt

                echo "built image=$IMAGE digest=$DIGEST platform=linux/amd64"
            resources:
              limits:
                cpu: "2"
                memory: 2Gi
              requests:
                cpu: "1"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: workspace
                mountPath: /workspace
              - name: client-cert
                mountPath: /etc/buildkit-client
                readOnly: true
              - name: registry-config
                mountPath: /etc/buildkit-registry
                readOnly: true

          - name: cleanup
            dependencies:
              - main
            image: "docker.op.vaarst.io/docker_proxy/alpine/git@sha256:a4bb51f1a3553df194ce679fc1db721d8bfba2046fa1a88fe9d4ac551ffbce25"
            imagePullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - "rm -rf /workspace/src"
            resources:
              limits:
                cpu: 100m
                memory: 64Mi
              requests:
                cpu: 50m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            volumeMounts:
              - name: workspace
                mountPath: /workspace
